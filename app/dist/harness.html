:root {

  --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-serif: "Noto Serif KR", "Batang", "AppleMyungjo", serif;
  --ed-size: 17px; --ed-lh: 1.9; --ed-width: 680px; --ed-font: var(--font-serif);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14181c; --surface: #1b2127; --surface-2: #232a31; --fg: #e5e8eb; --muted: #9aa5af; --line: #2d363f;
  --accent: #7fb0e3; --accent-fg: #0f1a26; --accent-soft: #1f3146;
  --del-bg: #4a2723; --del-fg: #ffb4aa; --ins-bg: #1f3d2a; --ins-fg: #9fe0b5;
  --warn-bg: #3d3216; --warn-fg: #f3cf7a; --danger: #ff8a80; --ok: #8fdca8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14181c; --surface: #1b2127; --surface-2: #232a31; --fg: #e5e8eb; --muted: #9aa5af; --line: #2d363f;
  --accent: #7fb0e3; --accent-fg: #0f1a26; --accent-soft: #1f3146;
  --del-bg: #4a2723; --del-fg: #ffb4aa; --ins-bg: #1f3d2a; --ins-fg: #9fe0b5;
  --warn-bg: #3d3216; --warn-fg: #f3cf7a; --danger: #ff8a80; --ok: #8fdca8; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .mono { font-variant-numeric: tabular-nums; }

#app { display: flex; flex-direction: column; min-height: 100%; }
.top { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.brand { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav button:disabled { opacity: .4; cursor: default; }
.top .spacer { flex: 1; }
.savestate { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.savestate .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.savestate[data-s="dirty"] .dot, .savestate[data-s="saving"] .dot { background: #d4a017; }
.savestate[data-s="error"] .dot { background: var(--danger); }
.savestate[data-s="error"] { color: var(--danger); font-weight: 600; }

.banner { padding: 8px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; margin: 8px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner.danger { background: var(--del-bg); color: var(--del-fg); }
.banner.info { background: var(--accent-soft); color: var(--accent); }

.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; line-height: 1.3; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger.fill { background: var(--danger); color: #fff; }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=text], input[type=number], select, textarea.field, input[type=search] { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

main { flex: 1; padding: 16px 0 24px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin-bottom: 10px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.page-head h1 { font-size: 20px; }

/* 보관함 */
.recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 18px; }
.recent .card { cursor: pointer; }
.recent .card:hover { border-color: var(--accent); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; background: var(--surface-2); color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; min-width: 760px; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .title { font-weight: 600; cursor: pointer; }
.tbl .title:hover { color: var(--accent); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* 집필 */
.write { display: grid; grid-template-columns: 220px minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
.chapters, .panel { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 150px); overflow: auto; }
.chapters { display: flex; flex-direction: column; gap: 8px; }
.chlist { display: flex; flex-direction: column; gap: 2px; }
.chitem { display: flex; flex-direction: column; align-items: stretch; text-align: left; padding: 7px 10px; border-radius: 6px; border: 1px solid transparent; background: none; cursor: pointer; }
.chitem:hover { background: var(--surface-2); }
.chitem[aria-current="true"] { background: var(--surface); border-color: var(--accent); }
.chitem .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chitem .n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.editor-wrap { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .sep { width: 1px; height: 20px; background: var(--line); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 0 8px; }
.sheet-inner { width: min(100%, var(--ed-width)); margin: 0 auto; padding: 0 16px; }
input.chtitle { font-family: var(--ed-font); font-size: 1.25em; font-weight: 600; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; background: transparent; padding: 4px 0 8px; }
textarea#editor { width: 100%; min-height: 62vh; border: 0; outline: 0; resize: vertical; background: transparent; font-family: var(--ed-font); font-size: var(--ed-size); line-height: var(--ed-lh); padding: 14px 0 24px; word-break: keep-all; overflow-wrap: break-word; tab-size: 2; }
.statusbar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 12px; color: var(--muted); position: sticky; bottom: 8px; }
.statusbar b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 9px; cursor: pointer; color: var(--muted); font-size: 13px; }
.tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.panel .card { padding: 12px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
.row.cur { border-color: var(--accent); background: var(--accent-soft); }

.hit .ctx { font-size: 12px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }

/* 비교 */
.diff { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.diff .h { padding: 8px 12px; background: var(--surface-2); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--line); }
.diff .c { padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: var(--ed-font); line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 2.2em; }
.diff .c.l { border-right: 1px solid var(--line); }
.diff .chap { grid-column: 1 / -1; padding: 4px 12px; font-size: 11px; background: var(--accent-soft); color: var(--accent); }
.diff .skip { grid-column: 1 / -1; padding: 4px 12px; font-size: 12px; color: var(--muted); text-align: center; border-bottom: 1px solid var(--line); }
.c.del { background: var(--del-bg); } .c.add { background: var(--ins-bg); }
.c .d { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through; } .c .i { background: var(--ins-bg); color: var(--ins-fg); font-weight: 600; }
.c.mod.l .d { background: var(--del-bg); }
.empty-cell { color: var(--muted); font-size: 12px; font-style: italic; }

/* 통계 */
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 72px 1fr 56px; gap: 8px; align-items: center; font-size: 12px; }
.bar i { display: block; height: 14px; background: var(--accent); border-radius: 3px; min-width: 1px; }
.bar.alt i { background: #b0762a; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.jump { cursor: pointer; } .jump:hover { border-color: var(--accent); }

/* 모달·토스트 */
.modal-bg { position: fixed; inset: 0; background: rgba(10,14,18,.5); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px; z-index: 50; overflow: auto; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: min(560px, 100%); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.modal.wide { width: min(780px, 100%); }
.modal header { padding: 14px 18px 0; display: flex; justify-content: space-between; align-items: center; }
.modal header h2 { font-size: 16px; }
.modal .mb { padding: 12px 18px; display: flex; flex-direction: column; gap: 12px; }

body.focus .top, body.focus .chapters, body.focus .panel, body.focus .statusbar .hide-focus, body.focus .toolbar { display: none; }

.focus-exit { display: none; }
body.focus .focus-exit { display: inline-block; position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 20; }

@media (max-width: 1100px) {
  .write { grid-template-columns: 200px minmax(0, 1fr); }
  .panel { grid-column: 1 / -1; position: static; max-height: none; }
}
@media (max-width: 720px) {
  .write { grid-template-columns: minmax(0, 1fr); }
  .chapters { position: static; max-height: none; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .diff { grid-template-columns: minmax(0, 1fr); }
  .diff .c.l { border-right: 0; }
  textarea#editor { min-height: 50vh; }
  .statusbar { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

  /* ───────────── 버전 ───────────── */
  function makeVersion(o) {

  /* ───────────── 비교 ───────────── */
  const DP_LIMIT = 6000000;

      const tail = [];
      while (aLo < aHi && bLo < bHi && KA[aHi - 1] === KB[bHi - 1]) { aHi--; bHi--; tail.push([aHi, bHi]); }

          ca.forEach((i, k) => { if (i >= 0 && cb.has(k) && cb.get(k) >= 0) cand.push([i, cb.get(k)]); });
          cand.sort((x, y) => x[0] - y[0]);

  /* ───────────── 가져오기 정리 ───────────── */
  const SPECIAL_SPACES = /[   -   　]/g;

    const before = t;
    t = t.replace(/\r\n?/g, '\n');

  /* ───────────── 장 나누기(가져오기) ───────────── */
  const HEAD_RES = [/^#{1,3}\s+(.+?)\s*#*\s*$/, /^(제\s*\d+\s*[장화부편].*)$/, /^((?:chapter|CHAPTER|Chapter)\s*\d+.*)$/, /^((?:프롤로그|에필로그|서장|종장|서막|후기)\s*.*)$/];

  function splitChapters(lines, opts) {
    opts = opts || {};

    const chapters = [];
    let cur = null;
    const startCh = (title) => { cur = { title, lines: [] }; chapters.push(cur); };
    for (const it of items) {
      const h = it.heading ? it.text.trim() : (opts.detect === false ? null : headingOf(it.text));

      if (!cur) startCh(opts.firstTitle || '본문');

    }

  /* ───────────── 내보내기 텍스트 ───────────── */
  function toTxt(ver, o) {
    o = Object.assign({ workTitle: '', chapterTitles: true }, o || {});
    const parts = [];

    ver.chapters.forEach((ch, i) => {

  }
  function toMarkdown(ver, o) {
    o = Object.assign({ workTitle: '' }, o || {});

    if (o.workTitle) parts.push('# ' + o.workTitle);
    for (const ch of ver.chapters) {

      parts.push(body.join('\n\n'));
    }
    return parts.join('\n\n') + '\n';
  }

  /* ───────────── 신상 정보 점검(응모용) ───────────── */
  function privacyScan(ver, names) {
    const rules = [
      ['휴대전화 번호', /01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/g],
      ['전화번호', /\b0(?:2|[3-6]\d|70|80)[-.\s]\d{3,4}[-.\s]\d{4}\b/g],
      ['이메일', /[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g],

      ['주소 형태', /[가-힣]+(?:시|도)\s*[가-힣]+(?:구|군|시)\s*[가-힣0-9]+(?:로|길|동)\s*\d+/g],
    ];
    (names || []).filter(Boolean).forEach((n) => rules.push(['등록한 이름 "' + n + '"', new RegExp(escapeRe(n), 'g')]));
    const out = [];
    ver.chapters.forEach((ch, ci) => ch.paragraphs.forEach((p, pi) => {
      for (const [label, re] of rules) { re.lastIndex = 0; let m; while ((m = re.exec(p.text))) { out.push({ label, hit: m[0], chapterIndex: ci, chapterTitle: ch.title, paraIndex: pi }); if (m[0].length === 0) re.lastIndex++; } }
    }));

  }

  /* ───────────── 문체 통계 (로컬 계산, 형태소 분석이 아닌 근사치) ───────────── */
  const SENT_RE = /[^.!?…。\n]+(?:[.!?…。]+["”’'」』)\]]*)?/g;

  const STOP = new Set('그리고 하지만 그러나 그래서 그런데 그러면 그러자 그것 이것 저것 그녀 우리 자신 아니 하나 어떤 어느 모든 다시 이미 아직 바로 조금 계속 같은 같이 하는 하고 하며 했다 한다 있는 있다 없는 없다 있었다 없었다 되어 되는 된다 이런 그런 저런 이렇게 그렇게 어떻게 무슨 정말 너무 아주 매우 오래 먼저 다음 지금 때문 사람 생각'.split(' '));

  const isDialogueLine = (t) => /^\s*[“"‘'「『]/.test(t) && /[”"’'」』]\s*[.!?…]*\s*$/.test(t);

  function styleStats(ver, o) {

      async getJob(id) { return clone(jobs.get(id)); },
      async listJobs(workId) { return [...jobs.values()].filter((j) => !workId || j.workId === workId).map(clone); },
      async deleteJob(id) { jobs.delete(id); },
      async listVersionMeta(workId) { return [...versions.values()].filter((v) => v.workId === workId).map(metaOf); },
      async getVersion(id) { return clone(versions.get(id)); },
      async putVersion(v) { versions.set(v.id, clone(v)); },
      async deleteVersion(id) { versions.delete(id); },
      async getMeta(k) { return clone(meta.get(k)); },
      async setMeta(k, val) { meta.set(k, clone(val)); },
      async exportAll() { return { works: [...works.values()].map(clone), versions: [...versions.values()].map(clone), prefs: clone(meta.get('prefs')) || {} }; },
      async importAll(d) { (d.works || []).forEach((w) => works.set(w.id, clone(w))); (d.versions || []).forEach((v) => versions.set(v.id, clone(v))); },
      async estimate() { return null; },
      async persisted() { return false; },
      async requestPersist() { return false; },
    };
  }

  const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const done = (tx) => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('transaction aborted')); });

  async function openIdb() {
    const idb = (typeof indexedDB !== 'undefined') ? indexedDB : null;
    if (!idb) throw new Error('이 환경에는 IndexedDB가 없습니다.');
    const db = await new Promise((res, rej) => {
      const r = idb.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('works')) d.createObjectStore('works', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('versions')) d.createObjectStore('versions', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('vmeta')) d.createObjectStore('vmeta', { keyPath: 'id' }).createIndex('workId', 'workId');
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
        if (!d.objectStoreNames.contains('jobs')) d.createObjectStore('jobs', { keyPath: 'id' }).createIndex('workId', 'workId');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('다른 탭이 저장소를 잡고 있습니다.'));
    });
    // 실제로 쓰고 읽어 본다(시크릿 창 등에서 열리기만 하고 쓰기는 실패하는 경우 대비)
    const tx = db.transaction('meta', 'readwrite');
    tx.objectStore('meta').put(Date.now(), '__probe');
    await done(tx);
    return db;
  }

  async function createStorage() {
    let db;
    try { db = await openIdb(); }
    catch (e) { return createMemoryStorage(String(e && e.message || e)); }
    const get = async (store, key) => req(db.transaction(store).objectStore(store).get(key));
    const all = async (store) => req(db.transaction(store).objectStore(store).getAll());
    const api = {
      kind: 'indexeddb', persistent: true,
      listWorks: () => all('works'),
      getWork: (id) => get('works', id),
      async putWork(w) { const tx = db.transaction('works', 'readwrite'); tx.objectStore('works').put(clone(w)); await done(tx); },
      async deleteWork(id) {
        const metas = await api.listVersionMeta(id), js = await api.listJobs(id);
        const tx = db.transaction(['works', 'versions', 'vmeta', 'jobs'], 'readwrite');
        tx.objectStore('works').delete(id);
        js.forEach((j) => tx.objectStore('jobs').delete(j.id));
        metas.forEach((m) => { tx.objectStore('versions').delete(m.id); tx.objectStore('vmeta').delete(m.id); });
        await done(tx);
      },
      listVersionMeta: (workId) => req(db.transaction('vmeta').objectStore('vmeta').index('workId').getAll(workId)),
      getVersion: (id) => get('versions', id),
      async putVersion(v) { const tx = db.transaction(['versions', 'vmeta'], 'readwrite'); tx.objectStore('versions').put(clone(v)); tx.objectStore('vmeta').put(metaOf(v)); await done(tx); },
      async deleteVersion(id) { const tx = db.transaction(['versions', 'vmeta'], 'readwrite'); tx.objectStore('versions').delete(id); tx.objectStore('vmeta').delete(id); await done(tx); },
      async putJob(j) { const tx = db.transaction('jobs', 'readwrite'); tx.objectStore('jobs').put(clone(j)); await done(tx); },
      getJob: (id) => get('jobs', id),
      listJobs: (workId) => (workId ? req(db.transaction('jobs').objectStore('jobs').index('workId').getAll(workId)) : all('jobs')),
      async deleteJob(id) { const tx = db.transaction('jobs', 'readwrite'); tx.objectStore('jobs').delete(id); await done(tx); },
      getMeta: (k) => get('meta', k),
      async setMeta(k, val) { const tx = db.transaction('meta', 'readwrite'); tx.objectStore('meta').put(clone(val), k); await done(tx); },
      async exportAll() { return { works: await all('works'), versions: await all('versions'), prefs: (await get('meta', 'prefs')) || {} }; },
      async importAll(d) {
        const tx = db.transaction(['works', 'versions', 'vmeta'], 'readwrite');
        (d.works || []).forEach((w) => tx.objectStore('works').put(clone(w)));
        (d.versions || []).forEach((v) => { tx.objectStore('versions').put(clone(v)); tx.objectStore('vmeta').put(metaOf(v)); });
        await done(tx);
      },
      async estimate() { try { return await navigator.storage.estimate(); } catch (e) { return null; } },
      async persisted() { try { return await navigator.storage.persisted(); } catch (e) { return false; } },
      async requestPersist() { try { return await navigator.storage.persist(); } catch (e) { return false; } },
    };
    return api;
  }
  return { createStorage, createMemoryStorage, metaOf };
});

  const STYLE_PRESETS = {

  };

  /* ── 구성 도구 ── */
  const fence = (tag, text) => `<${tag}>\n${String(text == null ? '' : text).replace(/<\//g, '<​/')}\n</${tag}>`;
  function compose(o) {
    const out = [];
    out.push(ROLES[o.role] || '');
    out.push('[공통 원칙]\n- ' + COMMON);

    const chs = d.chapters || [];
    const n = Math.max(sums.length, chs.length), upTo = o.upTo == null ? n : Math.min(n, o.upTo);
    const lines = []; for (let i = 0; i < upTo; i++) { const s = sums[i] || (chs[i] && chs[i].summary); if (s) lines.push(`${i + 1}장${chs[i] && chs[i].title ? ' ' + chs[i].title : ''}: ${clip(s, 260)}`); }
    if (lines.length) parts.push('장별 요약:\n' + lines.join('\n'));
    if (b.facts && b.facts.length) parts.push('확정된 사실:\n' + b.facts.filter((f) => o.upTo == null || f.chapter <= o.upTo).slice(-40).map((f) => `- [${f.kind || '기타'}] ${f.fact}`).join('\n'));
    return clip(parts.join('\n\n'), o.maxChars);
  }

  /* ───────────── 엔진: 호출 래퍼 ───────────── */
  function createEngine(env) {
    const sample = env.sample, cfg = Object.assign({}, DEFAULT_CONFIG, env.config || {});
    cfg.tiers = Object.assign({}, DEFAULT_CONFIG.tiers, (env.config && env.config.tiers) || {});
    const sleep = env.sleep || ((ms) => new Promise((r) => setTimeout(r, ms)));
    const now = env.now || (() => Date.now());
    const stats = { calls: 0, inChars: 0, outChars: 0, ms: 0 };
    let allowedTiers = null;
    const api = { currentJob: null };
    const record = (e) => { if (api.currentJob) api.currentJob.log.push(Object.assign({ step: api.currentJob.currentStep }, e)); if (env.onCall) env.onCall(e); };
    const tierFor = (role, override) => { let t = override || cfg.tiers[role] || 'default'; if (allowedTiers && !allowedTiers.includes(t)) t = allowedTiers.includes('default') ? 'default' : allowedTiers[0]; return t; };

    async function call(spec) {
      if (typeof sample !== 'function') throw new AIError('not_granted', 'AI를 사용할 수 없습니다.');
      let prompt = spec.prompt;
      if (bytes(prompt) > cfg.maxPromptBytes) throw new AIError('prompt_too_large', `입력이 너무 깁니다(${bytes(prompt)}바이트).`);
      const entry = { t: new Date(now()).toISOString(), role: spec.role, task: spec.task, tier: tierFor(spec.role, spec.tier), inChars: prompt.length, outChars: 0, ms: 0, ok: false, code: '', promptVersion: P.PROMPT_VERSION, label: spec.label || '' };
      const t0 = now();
      let formatRetry = false, upRetry = 0;
      for (;;) {
        try {
          const opts = { modelTier: entry.tier, cache: false };
          if (spec.signal) opts.signal = spec.signal;
          if (spec.onText) opts.onText = spec.onText;
          let out;
          if (spec.json) {
            let data;
            if (typeof sample.json === 'function') data = await sample.json(prompt, opts);
            else { const r = await sample(prompt, opts); data = extractJSON(r.text); }
            const errs = spec.validate ? spec.validate(data) : [];
            if (errs.length) throw new AIError('invalid_json', '형식 검증 실패: ' + errs.slice(0, 4).join(', '), { text: JSON.stringify(data).slice(0, 400) });
            out = { data, outChars: JSON.stringify(data).length };
          } else {
            const r = await sample(prompt, opts);
            out = { text: r.text, truncated: !!r.truncated, outChars: r.text.length };
          }
          entry.ok = true; entry.outChars = out.outChars; entry.ms = now() - t0;
          stats.calls++; stats.inChars += entry.inChars; stats.outChars += entry.outChars; stats.ms += entry.ms;
          record(entry);
          return out;
        } catch (e) {
          const code = (e && e.code) || 'upstream_error';
          if (code === 'cancelled') { entry.code = code; entry.ms = now() - t0; record(entry); throw e instanceof AIError ? e : new AIError('cancelled', '중지됨'); }
          if (code === 'upstream_error' && upRetry < cfg.retries) { upRetry++; await sleep(cfg.backoffMs * upRetry); continue; }
          if ((code === 'invalid_json' || code === 'empty_completion') && !formatRetry) {
            formatRetry = true;
            prompt += '\n\n[재요청] 직전 응답이 지정한 형식에 맞지 않았다' + (e.message ? ' (' + clip(e.message, 120) + ')' : '') + '. 설명 없이 지정한 형식만 출력한다.';
            continue;
          }
          entry.code = code; entry.ms = now() - t0; stats.calls++; stats.inChars += entry.inChars; stats.ms += entry.ms;
          record(entry);
          throw e instanceof AIError ? e : new AIError(code, (e && e.message) || code, { text: e && e.text });
        }
      }
    }
    return Object.assign(api, { call, cfg, stats, tierFor, setAllowedTiers: (a) => { allowedTiers = a; }, sample });
  }

  /* ───────────── 작업(job) 만들기 ───────────── */
  const SEV_RANK = { 치명: 3, 중요: 2, 경미: 1 };
  const critMajor = (issues) => issues.filter((i) => i.severity === '치명' || i.severity === '중요').length;
  const step = (kind, arg, label) => ({ id: kind + (arg == null ? '' : '#' + arg) + '@' + Math.random().toString(36).slice(2, 6), kind, arg: arg == null ? null : arg, label, status: 'pending', error: '', calls: 0 });
  const KIND_LABEL = { 'AI 초고': 'AI 초고', 'AI 개고': 'AI 개고', 'AI 변환': 'AI 변환' };
  function newJob(type, workId, params, steps) {
    const t = new Date().toISOString();
    return { id: C.uid('job'), workId, type, status: 'pending', createdAt: t, updatedAt: t, params, steps, state: { chapters: {}, notes: [] }, log: [], resultVersionId: null, report: { unprocessed: [], warnings: [] }, pausedReason: '', stats: { calls: 0, inChars: 0, outChars: 0, ms: 0 } };
  }
  const TYPE_LABEL = { write: 'AI 자동 집필', draft: 'AI 초고 집필', revise: 'AI 자동 개고', oneclick: '원클릭 AI 완성', judge: '작품 진단', convert: '장르·형식 변환', phase: 'AI 구상', edits: '개고 제안(편집자 모드)', proofread: 'AI 자동 교열', analyze: '설정 추출', continuity: '연속성 점검', period: '고증 점검' };

  // chapters: 대상 버전의 장 수(작성 작업은 설계 후에 정해지므로 steps 가 동적으로 늘어난다)
  function buildJob(type, work, params, info) {
    info = info || {};
    const n = info.chapterCount || 0;
    const scope = params.scope && params.scope.length ? params.scope : Array.from({ length: n }, (_, i) => i);
    let steps = [];
    if (type === 'phase') {
      if (params.phases.includes('idea')) steps.push(step('idea', null, '구상 만들기'));
      if (params.phases.includes('design')) steps.push(step('design', null, '시놉시스·구조 설계'));
    } else if (type === 'draft') {
      const chs = (work.bible && work.bible.design && work.bible.design.chapters) || [];
      steps.push(step('prep', null, '작업 준비'));
      chs.forEach((c, i) => steps.push(step('draft_ch', i, `${i + 1}장 집필 — ${c.title}`)));
      chs.forEach((c, i) => steps.push(step('review_ch', i, `${i + 1}장 자동 검토`)));
      steps.push(step('finalize', null, '초고 마무리'));
    } else if (type === 'revise') {
      steps.push(step('prep', null, '작업 준비'));
      scope.forEach((i) => steps.push(step('analyze_ch', i, `${i + 1}장 설정 추출`)));
      scope.forEach((i) => steps.push(step('diag_ch', i, `${i + 1}장 진단`)));
      scope.forEach((i) => steps.push(step('rev_ch', i, `${i + 1}장 개고`)));
      steps.push(step('finalize', null, '개고본 마무리'));
    } else if (type === 'oneclick') {
      steps.push(step('prep', null, '① 작품 읽기 준비'));
      scope.forEach((i) => steps.push(step('analyze_ch', i, `① ${i + 1}장 읽기·설정 추출`)));
      steps.push(step('structure', null, '① 구조 분석'));
      scope.forEach((i) => steps.push(step('diag_ch', i, `② ${i + 1}장 결함·개연성 분석`)));
      steps.push(step('strategy', null, '③ 개고 전략 수립'));
      scope.forEach((i) => steps.push(step('rev_ch', i, `④ ${i + 1}장 개고`)));
      scope.forEach((i) => steps.push(step('polish_ch', i, `⑤ ${i + 1}장 문장·대화 재검토`)));
      steps.push(step('style_check', null, '⑥ 문체 일관성 검토'));
      scope.forEach((i) => steps.push(step('proof_ch', i, `⑦ ${i + 1}장 교열`)));
      scope.forEach((i) => steps.push(step('cont_ch', i, `⑧ ${i + 1}장 연속성 검증`)));
      steps.push(step('finalize', null, '⑨ 최종 원고 생성'));
      steps.push(step('judge', null, '⑩ 최종 심사위원 평가'));
    } else if (type === 'edits') {
      steps.push(step('prep', null, '작업 준비'), step('diag_edits', null, '진단(씨·거둠 지도, 문제 목록)'));
      (params.passes || []).forEach((ps) => scope.forEach((i) => steps.push(Object.assign(step('edit_pass', i, `${i + 1}장 · ${ps} 패스`), { pass: ps }))));
      steps.push(step('finalize_edits', null, '제안 정리'));
    } else if (type === 'proofread') {
      steps.push(step('prep', null, '작업 준비'));
      scope.forEach((i) => steps.push(step('proof_ch', i, `${i + 1}장 교열`)));
      steps.push(step('finalize', null, '교열본 마무리'));
    } else if (type === 'analyze') {
      scope.forEach((i) => steps.push(step('analyze_ch', i, `${i + 1}장 설정 추출`)));
    } else if (type === 'continuity') {
      scope.forEach((i) => steps.push(step('cont_ch', i, `${i + 1}장 연속성 점검`)));
    } else if (type === 'period') {
      scope.forEach((i) => steps.push(step('period_ch', i, `${i + 1}장 고증 점검`)));
    } else if (type === 'judge') {
      steps.push(step('judge', null, '심사위원 평가'));
    } else if (type === 'convert') {
      steps.push(step('prep', null, '변환 준비'));
      const chunks = info.chunks || 1;
      for (let k = 0; k < chunks; k++) steps.push(step('conv_chunk', k, `${k + 1}/${chunks} 변환`));
      for (let k = 0; k < chunks; k++) steps.push(step('map_chunk', k, `${k + 1}/${chunks} 장면 대응표`));
      steps.push(step('finalize', null, '변환본 마무리'));
    } else throw new Error('알 수 없는 작업 종류: ' + type);
    return newJob(type, work.id, params, steps);
  }

  // 사전 안내용 추정(호출 횟수·시간). 정확한 값이 아니다.
  const CALL_WEIGHT = {
    idea: [1, 'default'], design: [1, 'default'], prep: [0, 'quick'], draft_ch: null, review_ch: [2, 'default'], analyze_ch: [1, 'quick'], diag_ch: [1, 'default'],
    rev_ch: null, rediag_ch: [2, 'default'], structure: [1, 'default'], strategy: [1, 'default'], polish_ch: null, style_check: [1, 'default'], proof_ch: null,
    cont_ch: [1, 'default'], period_ch: [1, 'default'], diag_edits: [1, 'default'], edit_pass: [1, 'default'], finalize_edits: [0, 'quick'], finalize: [0, 'quick'], judge: [1, 'complex'], conv_chunk: [1, 'complex'], map_chunk: [1, 'quick'],
  };
  function estimateJob(job, cfg, history) {
    cfg = Object.assign({}, DEFAULT_CONFIG, cfg || {});
    const avg = Object.assign({}, cfg.avgMs, history || {});
    let calls = 0, ms = 0;
    const add = (n, tier) => { calls += n; ms += n * (avg[tier] || avg.default); };
    const level = (job.params && job.params.level) || 4;
    const chunkCalls = (chars, size) => Math.max(1, Math.ceil(chars / size));
    job.steps.filter((s) => s.status === 'pending' || s.status === 'running').forEach((s) => {
      const w = CALL_WEIGHT[s.kind];
      if (w) { add(w[0], w[1]); return; }
      const chars = (job.params.chapterChars && job.params.chapterChars[s.arg]) || 3000;
      if (s.kind === 'draft_ch') { const sc = (job.params.sceneCounts && job.params.sceneCounts[s.arg]) || chunkCalls(chars, cfg.chunkChars); add(sc, 'complex'); add(1, 'quick'); }
      else if (s.kind === 'rev_ch') { add(chunkCalls(chars, level === 5 ? cfg.reviseChunkChars5 : cfg.reviseChunkChars) + (level >= 4 ? 1 : 0), 'complex'); }
      else if (s.kind === 'polish_ch') add(chunkCalls(chars, cfg.reviseChunkChars), 'complex');
      else if (s.kind === 'proof_ch') add(chunkCalls(chars, 3000), 'default');
    });
    if (job.params && job.params.loop && job.params.loop.on) { const chs = job.steps.filter((s) => s.kind === 'rev_ch').length; add(chs * 2 * (job.params.loop.max || 1) * 0.6, 'default'); calls = Math.round(calls); }
    return { calls: Math.round(calls), minMinutes: Math.max(1, Math.round((ms * 0.6) / 60000)), maxMinutes: Math.max(1, Math.round((ms * 1.8) / 60000)) };
  }

  /* ───────────── 판정 입력 구성 ───────────── */
  function buildJudgeInput(ver, work, maxBytes) {
    const texts = ver.chapters.map((c, i) => `【${i + 1}장${c.title ? ' ' + c.title : ''}】\n${C.chapterText(c)}`);
    const total = texts.join('\n\n');
    const chars = C.countWithSpaces(C.versionText(ver));
    if (bytes(total) <= maxBytes) return { text: total, coverage: `전체 ${ver.chapters.length}개 장의 전문을 읽었다(공백 포함 ${chars}자). 읽지 못한 부분은 없다.`, full: true };
    const sums = (work.bible && work.bible.chapterSummaries) || [];
    let budget = maxBytes, parts = [], fullIdx = [], excerptIdx = [], sumOnly = [];
    const idxs = ver.chapters.map((_, i) => i);
    const pick = [0, ver.chapters.length - 1].filter((v, i, a) => a.indexOf(v) === i);
    const used = new Set();
    const addFull = (i) => { const t = texts[i]; if (bytes(t) <= budget * 0.45) { parts[i] = t; budget -= bytes(t); fullIdx.push(i + 1); used.add(i); return true; } return false; };
    pick.forEach((i) => { if (!addFull(i)) { const t = lastChars(texts[i], 9000); parts[i] = '(발췌) ' + t; budget -= bytes(t); excerptIdx.push(i + 1); used.add(i); } });
    idxs.filter((i) => !used.has(i)).forEach((i) => { const ex = clip(C.chapterText(ver.chapters[i]), 2500); if (bytes(ex) < budget * 0.5) { parts[i] = `【${i + 1}장 발췌(앞부분)】\n${ex}`; budget -= bytes(ex); excerptIdx.push(i + 1); } else { parts[i] = `【${i + 1}장 요약만】 ${clip(sums[i] || '', 300)}`; sumOnly.push(i + 1); } });
    const cov = `전문을 읽은 장: ${fullIdx.join(', ') || '없음'} / 일부만 읽은 장(발췌): ${excerptIdx.join(', ') || '없음'} / 요약만 본 장: ${sumOnly.join(', ') || '없음'}. 분량 때문에 전체를 읽지 못했으므로, 읽지 못한 부분에 대한 평가는 하지 않는다.`;
    return { text: parts.filter(Boolean).join('\n\n'), coverage: cov, full: false, partial: { fullIdx, excerptIdx, sumOnly } };
  }

  /* ───────────── 작업 실행기 ───────────── */
  function createRunner(env) {
    const { engine, storage } = env;
    const cfg = engine.cfg;
    const emit = (job) => { if (env.onEvent) env.onEvent({ type: 'job', job }); };

    async function run(job, runOpts) {
      runOpts = runOpts || {};
      const signal = runOpts.signal;
      job._base = Object.assign({ calls: 0, inChars: 0, outChars: 0, ms: 0 }, job.stats);
      job.status = 'running'; job.pausedReason = ''; await save(job);
      const ctx = makeCtx(job, signal);
      for (;;) {
        if (signal && signal.aborted) { job.status = 'paused'; job.pausedReason = '사용자가 중지했습니다.'; await save(job); return job; }
        const idx = job.steps.findIndex((s) => s.status === 'pending' || s.status === 'running' || s.status === 'failed');
        if (idx < 0) break;
        const st = job.steps[idx];
        st.status = 'running'; st.error = ''; st.startedAt = new Date().toISOString(); job.currentStep = st.id; await save(job);
        const callsBefore = engine.stats.calls;
        try {
          await exec(ctx, st, idx);
          st.status = st.status === 'running' ? 'done' : st.status;
        } catch (e) {
          const code = (e && e.code) || 'error';
          st.calls += engine.stats.calls - callsBefore;
          if (code === 'refused') { st.status = 'refused'; st.error = 'Claude가 이 입력을 처리하지 않았습니다.'; ctx.unprocessed(st, '모델이 처리를 거부함'); }
          else if (code === 'cancelled') { st.status = 'pending'; job.status = 'paused'; job.pausedReason = '사용자가 중지했습니다.'; await save(job); return job; }
          else if (code === 'rate_limited' || code === 'session_expired') { st.status = 'pending'; job.status = 'paused'; job.pausedReason = code === 'rate_limited' ? '호출 한도에 도달했습니다. 잠시 뒤 이어서 진행하세요.' : '로그인이 만료되었습니다. 다시 로그인한 뒤 이어서 진행하세요.'; await save(job); return job; }
          else if (FATAL.has(code)) { st.status = 'failed'; st.error = e.message; job.status = 'failed'; job.pausedReason = 'AI를 사용할 수 없습니다: ' + e.message; await save(job); return job; }
          else { st.status = 'failed'; st.error = (e && e.message) || String(e); job.status = 'paused'; job.pausedReason = `“${st.label}”에서 멈췄습니다: ${st.error}`; await save(job); return job; }
        }
        st.endedAt = new Date().toISOString(); st.calls += engine.stats.calls - callsBefore;
        await save(job);
      }
      const incomplete = job.steps.some((s) => s.status === 'refused' || s.status === 'skipped');
      job.status = incomplete ? 'partial' : 'done';
      if (ctx.resultVer) { ctx.resultVer.ai = Object.assign(ctx.resultVer.ai || {}, { status: incomplete ? 'incomplete' : 'complete' }); await ctx.saveVer(); }
      await save(job);
      return job;
    }
    async function save(job) { job.updatedAt = new Date().toISOString(); const b = job._base || { calls: 0, inChars: 0, outChars: 0, ms: 0 }; job.stats = { calls: b.calls + engine.stats.calls, inChars: b.inChars + engine.stats.inChars, outChars: b.outChars + engine.stats.outChars, ms: b.ms + engine.stats.ms }; if (job.log.length > 400) job.log = job.log.slice(-400); await storage.putJob(job); emit(job); }

    function makeCtx(job, signal) {
      const ctx = { job, signal, resultVer: null };
      ctx.getWork = () => (env.getWork ? env.getWork(job.workId) : storage.getWork(job.workId));
      ctx.updateWork = async (fn) => { if (env.updateWork) return env.updateWork(job.workId, fn); const w = await storage.getWork(job.workId); fn(w); await storage.putWork(w); return w; };
      ctx.base = async () => (job.params.baseVersionId ? storage.getVersion(job.params.baseVersionId) : null);
      ctx.saveJob = () => save(job);
      ctx.note = (msg) => { job.state.notes.push(msg); };
      ctx.warn = (msg) => { job.report.warnings.push(msg); };
      ctx.unprocessed = (st, reason) => { job.report.unprocessed.push({ step: st.label, kind: st.kind, arg: st.arg, reason }); };
      ctx.call = async (spec) => {
        const prev = engine.stats.calls;
        try { return await engine.call(Object.assign({ signal }, spec)); }
        finally { /* 로그는 onCall 에서 */ }
      };
      ctx.insertAfter = (idx, steps) => { job.steps.splice(idx + 1, 0, ...steps); };
      ctx.loadResult = async () => { if (ctx.resultVer) return ctx.resultVer; if (!job.resultVersionId) return null; ctx.resultVer = await storage.getVersion(job.resultVersionId); return ctx.resultVer; };
      ctx.saveVer = async () => { if (ctx.resultVer) { ctx.resultVer.updatedAt = new Date().toISOString(); const t = C.aggregateCounts(ctx.resultVer.chapters.map((c) => C.countText(C.chapterText(c))), {}); ctx.resultVer.stats = { withSpaces: t.withSpaces, noSpaces: t.noSpaces, sheets: t.sheets }; await storage.putVersion(ctx.resultVer); } };
      ctx.storage = storage; ctx.cfg = cfg;
      return ctx;
    }
    async function exec(ctx, st, idx) {
      const H = HANDLERS[st.kind];
      if (!H) throw new AIError('transform_error', '알 수 없는 단계: ' + st.kind);
      engine.currentJob = ctx.job;
      await H(ctx, st, idx, env);
    }
    return { run, save };
  }

  /* ───────────── 단계 처리기 ───────────── */
  const HANDLERS = {};
  const chapterTarget = (work, i) => { const c = work.bible.design.chapters[i]; return (c && c.targetChars) || 0; };

  HANDLERS.idea = async (ctx) => {
    const work = await ctx.getWork();
    const r = await ctx.call({ role: '기획자', task: 'idea', prompt: P.T.idea(work), tier: 'default', json: true, validate: V.idea, label: '구상' });
    await ctx.updateWork((w) => { w.bible = w.bible || {}; w.bible.idea = r.data; });
  };
  HANDLERS.design = async (ctx, st, idx) => {
    const work = await ctx.getWork();
    const idea = work.bible && work.bible.idea; if (!idea) throw new AIError('transform_error', '구상이 없습니다.');
    let r;

  async function reviseChapter(ctx, i, opts) {

      const base = { level, automation: auto, label: `${i + 1}장 (${k + 1}/${chunks.length})`, bible: bibleText(work, { upTo: i + 1, maxChars: 3500 }), before: k > 0 ? lastChars(outChunks[k - 1], 600) : (i > 0 ? lastChars(C.chapterText(ver.chapters[i - 1]), 400) : ''), after: k < chunks.length - 1 ? clip(chunks[k + 1].join('\n'), 400) : '', issues: (opts.issues || []).filter((x) => !x.quote || text.includes(x.quote.slice(0, 20)) || chunks.length === 1), plan, extra: opts.extra || '', text };

        const out = cleanProse(r.text).text;
        const restored = restoreLocks(out, lk.locks.slice(lockSeen, lockSeen + nLocks), lockSeen);
        if (r.truncated || looksTruncated(out)) why = '끝맺지 못하고 끊겼다.';
        else if (restored == null) why = '잠금 표지가 빠지거나 순서가 바뀌었다.';
        else if (!driftOk(text.replace(/⟦잠금\d+⟧/g, '가'), out.replace(/⟦잠금\d+⟧/g, '가'), level)) why = `분량이 ${P.LEVELS[level].name} 범위를 벗어났다.`;

  async function readImportFile(file) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (ext === 'hwp') throw new Error('HWP(구형 형식)는 브라우저에서 읽을 수 없습니다. 한글에서 “다른 이름으로 저장”으로 HWPX, DOCX 또는 TXT로 저장한 뒤 올려 주세요.');
    if (ext === 'doc') throw new Error('구형 Word(.doc)는 지원하지 않습니다. DOCX나 TXT로 저장해 올려 주세요.');
    const buf = await file.arrayBuffer();
    let items, encoding = '';
    if (ext === 'docx' || ext === 'hwpx') {
      if (!window.JSZip) throw new Error('DOCX/HWPX를 읽는 라이브러리(JSZip)를 불러오지 못했습니다. TXT로 저장해 올려 주세요.');
      items = ext === 'docx' ? await D.readDocx(window.JSZip, buf) : await D.readHwpx(window.JSZip, buf);
    } else { const r = C.decodeBytes(buf); encoding = r.encoding; items = C.splitLines(r.text).map((t) => ({ text: t })); }
    return { name: file.name, ext, items, encoding };
  }

      for (const k in r.report) rep[k] = (rep[k] || 0) + r.report[k];
      return { text: r.text, heading: o.detect ? it.heading : false };
    });
    if (o.blank === 'remove') lines = lines.filter((l) => l.text.trim() !== '');
    else if (o.blank === 'collapse') { const out = []; for (const l of lines) { if (!l.text.trim() && out.length && !out[out.length - 1].text.trim()) continue; out.push(l); } lines = out; }
    return { chapters: C.splitChapters(lines, { detect: o.detect, firstTitle: '본문' }), report: rep };
  }

  /* ───────────── 예시 작품 ───────────── */
  async function seedSample() {
    const w = defaultWork({ title: '[예시] 새벽 시장', genre: '단편', status: '개고', synopsis: '새벽 시장의 부부가 석 달 치 외상을 받으러 가는 날의 이야기. (기능을 눌러 볼 수 있는 예시 작품입니다.)', memo: '예시 작품입니다. 편집·비교·내보내기를 마음껏 해 보시고, 필요 없으면 삭제하세요.', names: ['정숙', '용석'] });
    const chs = [
      ['제1장 새벽 시장', ['새벽 네 시가 되기 전에 정숙은 가게 셔터를 반쯤 올려 두었다. 불은 켜지 않았다. 냉장고 돌아가는 소리가 어둠 속에서 먼저 들렸다.', '골목 끝에서 트럭 문 닫히는 소리가 났다. 용석은 늘 문을 한 번에 닫지 못했다. 쾅, 하고 닫았다가 다시 열고, 또 쾅 닫았다. 정숙은 한 번 더 닫으라고 말해 본 적이 없었다.', '“오늘 대파가 좀 비싸요.”', '용석이 상자를 내려놓으며 말했다. 정숙은 대꾸하지 않고 상자 모서리의 물기를 행주로 닦았다. 대파가 비싼 건 지난주부터였다. 용석도 그걸 알았다.', '“그럼 반 상자만 둘까요?”', '“두 상자 둬. 저쪽 식당에서 가져간다니까.”', '“그 식당, 이번 달엔 외상 말고는 가져간 적이 없는데.”', '정숙은 행주를 접어 상자 위에 올려놓았다. 접은 행주는 금방 다시 젖었다.']],
      ['제2장 외상장부', ['외상장부는 계산대 서랍 맨 아래에 있었다. 표지가 닳아서 글씨가 거의 지워진 공책이었는데, 정숙은 어느 쪽이 위인지 보지 않고도 꺼냈다.', '식당 이름 옆에 날짜가 세 줄 적혀 있었다. 첫 줄은 용석의 글씨였고 나머지 두 줄은 정숙의 글씨였다. 금액은 같았다. 같은 금액이 석 달째 같은 자리에 적혀 있었다.', '“받으러 가요, 오늘.”', '정숙이 말했다. 용석은 장갑을 벗다가 멈췄다.', '“오늘은 말고.”', '“그럼 언제요.”', '“……”', '“언제냐고요.”', '용석은 장갑을 마저 벗어 상자 위에 올렸다. 장갑에서 파 냄새가 났다.']],
      ['제3장 셔터', ['해가 올라오자 시장은 금세 시끄러워졌다. 정숙은 셔터를 끝까지 올리고 가게 앞에 물을 뿌렸다.', '식당 주인은 점심 전에 왔다. 현금이 아니라 흰 봉투를 들고 왔는데, 봉투 안에는 가게 이름이 인쇄된 상품권이 들어 있었다. 정숙은 그걸 한참 쳐다보았다.', '“이건 어디서 쓰라고요.”', '“우리 가게에서 쓰시면 되죠.”', '정숙은 상품권을 장부 사이에 끼웠다. 웃지는 않았다. 용석이 뒤에서 헛기침을 했다.']],
    ];
    const v1 = C.makeVersion({ workId: w.id, label: '원문', kind: '원문', frozen: true, note: '예시 원문', chapters: chs.map(([t, ps]) => C.newChapter(t, ps.join('\n'))) });
    const ch2 = C.cloneChapters(v1.chapters);
    const edit = (ci, from, to) => { const p = ch2[ci].paragraphs.find((q) => q.text.includes(from)); if (p) p.text = p.text.replace(from, to); };
    edit(0, ' 불은 켜지 않았다.', ''); edit(1, '같은 금액이 석 달째 같은 자리에 적혀 있었다.', '같은 금액이 석 달째 그 자리에 있었다.');

    const v2 = C.makeVersion({ workId: w.id, parentId: v1.id, label: '1고', kind: '1고', frozen: true, note: '예시 개고본', chapters: ch2 });

  }

    $('#app').replaceChildren(
