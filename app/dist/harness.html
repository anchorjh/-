:root {

  --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-serif: "Noto Serif KR", "Batang", "AppleMyungjo", serif;
  --ed-size: 17px; --ed-lh: 1.9; --ed-width: 680px; --ed-font: var(--font-serif);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14181c; --surface: #1b2127; --surface-2: #232a31; --fg: #e5e8eb; --muted: #9aa5af; --line: #2d363f;
  --accent: #7fb0e3; --accent-fg: #0f1a26; --accent-soft: #1f3146;
  --del-bg: #4a2723; --del-fg: #ffb4aa; --ins-bg: #1f3d2a; --ins-fg: #9fe0b5;
  --warn-bg: #3d3216; --warn-fg: #f3cf7a; --danger: #ff8a80; --ok: #8fdca8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14181c; --surface: #1b2127; --surface-2: #232a31; --fg: #e5e8eb; --muted: #9aa5af; --line: #2d363f;
  --accent: #7fb0e3; --accent-fg: #0f1a26; --accent-soft: #1f3146;
  --del-bg: #4a2723; --del-fg: #ffb4aa; --ins-bg: #1f3d2a; --ins-fg: #9fe0b5;
  --warn-bg: #3d3216; --warn-fg: #f3cf7a; --danger: #ff8a80; --ok: #8fdca8; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .mono { font-variant-numeric: tabular-nums; }

#app { display: flex; flex-direction: column; min-height: 100%; }
.top { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.brand { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav button:disabled { opacity: .4; cursor: default; }
.top .spacer { flex: 1; }
.savestate { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.savestate .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.savestate[data-s="dirty"] .dot, .savestate[data-s="saving"] .dot { background: #d4a017; }
.savestate[data-s="error"] .dot { background: var(--danger); }
.savestate[data-s="error"] { color: var(--danger); font-weight: 600; }

.banner { padding: 8px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; margin: 8px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner.danger { background: var(--del-bg); color: var(--del-fg); }
.banner.info { background: var(--accent-soft); color: var(--accent); }

.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; line-height: 1.3; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger.fill { background: var(--danger); color: #fff; }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=text], input[type=number], select, textarea.field, input[type=search] { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

main { flex: 1; padding: 16px 0 24px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin-bottom: 10px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.page-head h1 { font-size: 20px; }

/* 보관함 */
.recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 18px; }
.recent .card { cursor: pointer; }
.recent .card:hover { border-color: var(--accent); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; background: var(--surface-2); color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; min-width: 760px; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .title { font-weight: 600; cursor: pointer; }
.tbl .title:hover { color: var(--accent); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* 집필 */
.write { display: grid; grid-template-columns: 220px minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
.chapters, .panel { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 150px); overflow: auto; }
.chapters { display: flex; flex-direction: column; gap: 8px; }
.chlist { display: flex; flex-direction: column; gap: 2px; }
.chitem { display: flex; flex-direction: column; align-items: stretch; text-align: left; padding: 7px 10px; border-radius: 6px; border: 1px solid transparent; background: none; cursor: pointer; }
.chitem:hover { background: var(--surface-2); }
.chitem[aria-current="true"] { background: var(--surface); border-color: var(--accent); }
.chitem .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chitem .n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.editor-wrap { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .sep { width: 1px; height: 20px; background: var(--line); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 0 8px; }
.sheet-inner { width: min(100%, var(--ed-width)); margin: 0 auto; padding: 0 16px; }
input.chtitle { font-family: var(--ed-font); font-size: 1.25em; font-weight: 600; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; background: transparent; padding: 4px 0 8px; }
textarea#editor { width: 100%; min-height: 62vh; border: 0; outline: 0; resize: vertical; background: transparent; font-family: var(--ed-font); font-size: var(--ed-size); line-height: var(--ed-lh); padding: 14px 0 24px; word-break: keep-all; overflow-wrap: break-word; tab-size: 2; }
.statusbar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 12px; color: var(--muted); position: sticky; bottom: 8px; }
.statusbar b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 9px; cursor: pointer; color: var(--muted); font-size: 13px; }
.tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.panel .card { padding: 12px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
.row.cur { border-color: var(--accent); background: var(--accent-soft); }

.hit .ctx { font-size: 12px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }

/* 비교 */
.diff { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.diff .h { padding: 8px 12px; background: var(--surface-2); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--line); }
.diff .c { padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: var(--ed-font); line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 2.2em; }
.diff .c.l { border-right: 1px solid var(--line); }
.diff .chap { grid-column: 1 / -1; padding: 4px 12px; font-size: 11px; background: var(--accent-soft); color: var(--accent); }
.diff .skip { grid-column: 1 / -1; padding: 4px 12px; font-size: 12px; color: var(--muted); text-align: center; border-bottom: 1px solid var(--line); }
.c.del { background: var(--del-bg); } .c.add { background: var(--ins-bg); }
.c .d { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through; } .c .i { background: var(--ins-bg); color: var(--ins-fg); font-weight: 600; }
.c.mod.l .d { background: var(--del-bg); }
.empty-cell { color: var(--muted); font-size: 12px; font-style: italic; }

/* 통계 */
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 72px 1fr 56px; gap: 8px; align-items: center; font-size: 12px; }
.bar i { display: block; height: 14px; background: var(--accent); border-radius: 3px; min-width: 1px; }
.bar.alt i { background: #b0762a; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.jump { cursor: pointer; } .jump:hover { border-color: var(--accent); }

/* 모달·토스트 */
.modal-bg { position: fixed; inset: 0; background: rgba(10,14,18,.5); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px; z-index: 50; overflow: auto; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: min(560px, 100%); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.modal.wide { width: min(780px, 100%); }
.modal header { padding: 14px 18px 0; display: flex; justify-content: space-between; align-items: center; }
.modal header h2 { font-size: 16px; }
.modal .mb { padding: 12px 18px; display: flex; flex-direction: column; gap: 12px; }

body.focus .top, body.focus .chapters, body.focus .panel, body.focus .statusbar .hide-focus, body.focus .toolbar { display: none; }

.focus-exit { display: none; }
body.focus .focus-exit { display: inline-block; position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 20; }

@media (max-width: 1100px) {
  .write { grid-template-columns: 200px minmax(0, 1fr); }
  .panel { grid-column: 1 / -1; position: static; max-height: none; }
}
@media (max-width: 720px) {
  .write { grid-template-columns: minmax(0, 1fr); }
  .chapters { position: static; max-height: none; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .diff { grid-template-columns: minmax(0, 1fr); }
  .diff .c.l { border-right: 0; }
  textarea#editor { min-height: 50vh; }
  .statusbar { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

  /* ───────────── 버전 ───────────── */
  function makeVersion(o) {

  /* ───────────── 비교 ───────────── */
  const DP_LIMIT = 6000000;

      const tail = [];
      while (aLo < aHi && bLo < bHi && KA[aHi - 1] === KB[bHi - 1]) { aHi--; bHi--; tail.push([aHi, bHi]); }

          ca.forEach((i, k) => { if (i >= 0 && cb.has(k) && cb.get(k) >= 0) cand.push([i, cb.get(k)]); });
          cand.sort((x, y) => x[0] - y[0]);

  /* ───────────── 가져오기 정리 ───────────── */
  const SPECIAL_SPACES = /[   -   　]/g;

    const before = t;
    t = t.replace(/\r\n?/g, '\n');

  /* ───────────── 장 나누기(가져오기) ───────────── */
  const HEAD_RES = [/^#{1,3}\s+(.+?)\s*#*\s*$/, /^(제\s*\d+\s*[장화부편].*)$/, /^((?:chapter|CHAPTER|Chapter)\s*\d+.*)$/, /^((?:프롤로그|에필로그|서장|종장|서막|후기)\s*.*)$/];

  function splitChapters(lines, opts) {
    opts = opts || {};

    const chapters = [];
    let cur = null;
    const startCh = (title) => { cur = { title, lines: [] }; chapters.push(cur); };
    for (const it of items) {
      const h = it.heading ? it.text.trim() : (opts.detect === false ? null : headingOf(it.text));

      if (!cur) startCh(opts.firstTitle || '본문');

    }

  /* ───────────── 내보내기 텍스트 ───────────── */
  function toTxt(ver, o) {
    o = Object.assign({ workTitle: '', chapterTitles: true }, o || {});
    const parts = [];

    ver.chapters.forEach((ch, i) => {

  }
  function toMarkdown(ver, o) {
    o = Object.assign({ workTitle: '' }, o || {});

    if (o.workTitle) parts.push('# ' + o.workTitle);
    for (const ch of ver.chapters) {

      parts.push(body.join('\n\n'));
    }
    return parts.join('\n\n') + '\n';
  }

  /* ───────────── 신상 정보 점검(응모용) ───────────── */
  function privacyScan(ver, names) {
    const rules = [
      ['휴대전화 번호', /01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/g],
      ['전화번호', /\b0(?:2|[3-6]\d|70|80)[-.\s]\d{3,4}[-.\s]\d{4}\b/g],
      ['이메일', /[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g],

      ['주소 형태', /[가-힣]+(?:시|도)\s*[가-힣]+(?:구|군|시)\s*[가-힣0-9]+(?:로|길|동)\s*\d+/g],
    ];
    (names || []).filter(Boolean).forEach((n) => rules.push(['등록한 이름 "' + n + '"', new RegExp(escapeRe(n), 'g')]));
    const out = [];
    ver.chapters.forEach((ch, ci) => ch.paragraphs.forEach((p, pi) => {
      for (const [label, re] of rules) { re.lastIndex = 0; let m; while ((m = re.exec(p.text))) { out.push({ label, hit: m[0], chapterIndex: ci, chapterTitle: ch.title, paraIndex: pi }); if (m[0].length === 0) re.lastIndex++; } }
    }));

  }

  /* ───────────── 문체 통계 (로컬 계산, 형태소 분석이 아닌 근사치) ───────────── */
  const SENT_RE = /[^.!?…。\n]+(?:[.!?…。]+["”’'」』)\]]*)?/g;

  const STOP = new Set('그리고 하지만 그러나 그래서 그런데 그러면 그러자 그것 이것 저것 그녀 우리 자신 아니 하나 어떤 어느 모든 다시 이미 아직 바로 조금 계속 같은 같이 하는 하고 하며 했다 한다 있는 있다 없는 없다 있었다 없었다 되어 되는 된다 이런 그런 저런 이렇게 그렇게 어떻게 무슨 정말 너무 아주 매우 오래 먼저 다음 지금 때문 사람 생각'.split(' '));

  const isDialogueLine = (t) => /^\s*[“"‘'「『]/.test(t) && /[”"’'」』]\s*[.!?…]*\s*$/.test(t);

  function styleStats(ver, o) {

    let items, encoding = '';
    if (ext === 'docx' || ext === 'hwpx') {
      if (!window.JSZip) throw new Error('DOCX/HWPX를 읽는 라이브러리(JSZip)를 불러오지 못했습니다. TXT로 저장해 올려 주세요.');
      items = ext === 'docx' ? await D.readDocx(window.JSZip, buf) : await D.readHwpx(window.JSZip, buf);
    } else { const r = C.decodeBytes(buf); encoding = r.encoding; items = C.splitLines(r.text).map((t) => ({ text: t })); }
    return { name: file.name, ext, items, encoding };
  }

      for (const k in r.report) rep[k] = (rep[k] || 0) + r.report[k];
      return { text: r.text, heading: o.detect ? it.heading : false };
    });
    if (o.blank === 'remove') lines = lines.filter((l) => l.text.trim() !== '');

      h('div', { class: 'stack', style: 'gap:6px' }, h('div', { class: 'small muted' }, '매수 방식'), rad('mode', 'simple', '단순 환산: 글자 수 ÷ (한 줄 칸 수 × 한 면 줄 수)'), rad('mode', 'grid', '원고지 모사: 문단마다 줄을 바꾸고 첫 칸을 비워 실제 원고지처럼 채움')),
      h('div', { class: 'stack', style: 'gap:6px' }, h('div', { class: 'small muted' }, '단순 환산의 글자 수 기준'), rad('basis', 'with', '공백 포함 (줄바꿈 제외)'), rad('basis', 'without', '공백 제외')),
      h('div', { class: 'grid2' }, num('cellsPerLine', '한 줄 칸 수', 5, 60), num('linesPerSheet', '한 면 줄 수', 5, 40)),
      h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: o.indent, onchange: (e) => { w.sheet.indent = e.target.checked; Object.assign(o, C.sheetSettings(w.sheet)); apply(); } }), '원고지 모사에서 문단 첫 칸 비우기'),
      box,
      h('div', { class: 'small muted' }, '글자 수는 줄바꿈을 뺀 글자(이모지는 1자)를 셉니다. 공백 제외는 띄어쓰기·탭·전각 공백·폭 없는 문자를 뺍니다. 원고지 모사는 줄 끝의 띄어쓰기를 생략하고, 줄 첫 칸에 올 수 없는 문장부호는 앞 줄 끝에 붙이며, 숫자·영문 소문자는 한 칸에 두 자를 넣습니다.'));
  }

  /* ───────────── 예시 작품 ───────────── */
  async function seedSample() {
    const w = defaultWork({ title: '[예시] 새벽 시장', genre: '단편', status: '개고', synopsis: '새벽 시장의 부부가 석 달 치 외상을 받으러 가는 날의 이야기. (기능을 눌러 볼 수 있는 예시 작품입니다.)', memo: '예시 작품입니다. 편집·비교·내보내기를 마음껏 해 보시고, 필요 없으면 삭제하세요.', names: ['정숙', '용석'] });
    const chs = [
      ['제1장 새벽 시장', ['새벽 네 시가 되기 전에 정숙은 가게 셔터를 반쯤 올려 두었다. 불은 켜지 않았다. 냉장고 돌아가는 소리가 어둠 속에서 먼저 들렸다.', '골목 끝에서 트럭 문 닫히는 소리가 났다. 용석은 늘 문을 한 번에 닫지 못했다. 쾅, 하고 닫았다가 다시 열고, 또 쾅 닫았다. 정숙은 한 번 더 닫으라고 말해 본 적이 없었다.', '“오늘 대파가 좀 비싸요.”', '용석이 상자를 내려놓으며 말했다. 정숙은 대꾸하지 않고 상자 모서리의 물기를 행주로 닦았다. 대파가 비싼 건 지난주부터였다. 용석도 그걸 알았다.', '“그럼 반 상자만 둘까요?”', '“두 상자 둬. 저쪽 식당에서 가져간다니까.”', '“그 식당, 이번 달엔 외상 말고는 가져간 적이 없는데.”', '정숙은 행주를 접어 상자 위에 올려놓았다. 접은 행주는 금방 다시 젖었다.']],
      ['제2장 외상장부', ['외상장부는 계산대 서랍 맨 아래에 있었다. 표지가 닳아서 글씨가 거의 지워진 공책이었는데, 정숙은 어느 쪽이 위인지 보지 않고도 꺼냈다.', '식당 이름 옆에 날짜가 세 줄 적혀 있었다. 첫 줄은 용석의 글씨였고 나머지 두 줄은 정숙의 글씨였다. 금액은 같았다. 같은 금액이 석 달째 같은 자리에 적혀 있었다.', '“받으러 가요, 오늘.”', '정숙이 말했다. 용석은 장갑을 벗다가 멈췄다.', '“오늘은 말고.”', '“그럼 언제요.”', '“……”', '“언제냐고요.”', '용석은 장갑을 마저 벗어 상자 위에 올렸다. 장갑에서 파 냄새가 났다.']],
      ['제3장 셔터', ['해가 올라오자 시장은 금세 시끄러워졌다. 정숙은 셔터를 끝까지 올리고 가게 앞에 물을 뿌렸다.', '식당 주인은 점심 전에 왔다. 현금이 아니라 흰 봉투를 들고 왔는데, 봉투 안에는 가게 이름이 인쇄된 상품권이 들어 있었다. 정숙은 그걸 한참 쳐다보았다.', '“이건 어디서 쓰라고요.”', '“우리 가게에서 쓰시면 되죠.”', '정숙은 상품권을 장부 사이에 끼웠다. 웃지는 않았다. 용석이 뒤에서 헛기침을 했다.']],
    ];
    const v1 = C.makeVersion({ workId: w.id, label: '원문', kind: '원문', frozen: true, note: '예시 원문', chapters: chs.map(([t, ps]) => C.newChapter(t, ps.join('\n'))) });
    const ch2 = C.cloneChapters(v1.chapters);
    const edit = (ci, from, to) => { const p = ch2[ci].paragraphs.find((q) => q.text.includes(from)); if (p) p.text = p.text.replace(from, to); };
    edit(0, ' 불은 켜지 않았다.', ''); edit(1, '같은 금액이 석 달째 같은 자리에 적혀 있었다.', '같은 금액이 석 달째 그 자리에 있었다.');
    ch2[1].paragraphs = ch2[1].paragraphs.filter((q) => q.text !== '“……”');
    const i = ch2[2].paragraphs.findIndex((q) => q.text.startsWith('식당 주인은')); ch2[2].paragraphs.splice(i + 1, 0, C.newParagraph('봉투는 얇았다.'));
    const v2 = C.makeVersion({ workId: w.id, parentId: v1.id, label: '1고', kind: '1고', frozen: true, note: '예시 개고본', chapters: ch2 });
    for (const v of [v1, v2]) { const t = C.aggregateCounts(v.chapters.map((c) => C.countText(C.chapterText(c), w.sheet)), w.sheet); v.stats = { withSpaces: t.withSpaces, noSpaces: t.noSpaces, sheets: t.sheets }; if (v === v2) w.counts = { withSpaces: t.withSpaces, noSpaces: t.noSpaces, sheets: t.sheets, simple: t.simple, grid: t.grid, chapters: v.chapters.length }; }
    w.currentVersionId = v2.id;
    await S.storage.putVersion(v1); await S.storage.putVersion(v2); await S.storage.putWork(w);
  }

  /* ───────────── 시작 ───────────── */
  async function boot() {
    $('#app').replaceChildren(
      h('div', { class: 'top' }, h('div', { class: 'brand' }, '《소설 작업실》'), h('nav', { class: 'nav', id: 'nav', 'aria-label': '주 메뉴' }), h('div', { class: 'small muted', id: 'worktitle', style: 'font-weight:600' }), h('div', { class: 'spacer' }), h('div', { class: 'savestate', id: 'savestate', 'data-s': 'saved' })),
      h('div', { id: 'storagebanner' }), h('main', { id: 'main' }), h('div', { id: 'modals' }), h('div', { id: 'toasts', 'aria-live': 'polite' }));
    S.storage = await ST.createStorage();
    try { Object.assign(S.prefs, (await S.storage.getMeta('prefs')) || {}); S.lastBackup = (await S.storage.getMeta('lastBackup')) || null; } catch (e) { /* 기본값 사용 */ }
    applyPrefs();
    try { if (!(await S.storage.getMeta('seeded'))) { await seedSample(); await S.storage.setMeta('seeded', true); } } catch (e) { /* 예시 작품은 없어도 된다 */ }
    await loadWorks(); render();
    if (S.storage.kind === 'indexeddb') S.storage.requestPersist();
    if (bc) bc.onmessage = (e) => { const m = e.data; if (m && m.from !== TAB.id && S.ver && m.versionId === S.ver.id && !S.otherWindow) { S.otherWindow = true; if (S.view === 'write') renderBanner(); } };
    window.__NS = { S, C, ST }; // 점검용
  }
  boot().catch((e) => { $('#app').replaceChildren(h('div', { class: 'banner danger', role: 'alert' }, '시작하지 못했습니다: ' + (e && e.message || e))); });
})();

</script>
